<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Vince Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .details-container{max-width:1000px;margin:70px auto;padding:0 24px}
        .details-hero{padding:55px 35px;text-align:center;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
        .details-icon{width:80px;height:80px;margin:0 auto 20px;display:grid;place-items:center;border-radius:20px;background:rgba(57,120,255,.12);color:var(--primary);font-size:34px}
        .details-category{display:inline-block;color:var(--primary);font-size:10px;font-weight:900;letter-spacing:2px}
        .details-hero h1{font-size:clamp(32px,5vw,52px);margin:10px 0}
        .details-hero>p{max-width:700px;margin:auto;color:var(--muted)}
        .details-tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px}
        .details-tags span{padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--muted);font-size:11px}
        .details-content{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
        .details-card{padding:28px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
        .details-card h2{font-size:19px;margin-bottom:13px}.details-card h2 i{color:var(--primary)}
        .details-card p,.details-card li{color:var(--muted);font-size:13px}
        .details-card ul{padding-left:18px}.details-card li{margin-bottom:8px}
        .back-link{display:inline-flex;gap:8px;align-items:center;color:var(--primary);font-weight:800;margin-bottom:20px}
        @media(max-width:700px){.details-content{grid-template-columns:1fr}.details-container{margin:35px auto}.details-hero{padding:38px 20px}}
    </style>
</head>
<body class="dark-theme">
    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">Vince<span>Portfolio.</span></a>
            <a href="index.html#projects" class="small-btn ghost"><i class="fas fa-arrow-left"></i> Back to Projects</a>
        </nav>
    </header>

    <main class="details-container" id="detailsContainer"></main>

    <footer>
        <a href="index.html" class="footer-logo">VincePortfolio.</a>
        <p>Designed and developed by Vince Patrick Parcon Maling.</p>
    </footer>

    <script>
        const projects = {
            "warehouse-inventory": {
                title:"Warehouse Inventory Management System",
                category:"SYSTEM / DATABASE PROJECT",
                icon:"fa-warehouse",
                description:"A practical warehouse inventory system for managing products, stock levels, inventory records, and day-to-day warehouse workflows.",
                overview:"The Warehouse Inventory Management System is designed around practical inventory operations. It provides a structured way to organize product records, monitor stock levels, and support day-to-day warehouse management.",
                features:["Product and inventory records","Stock-level monitoring","Organized warehouse data","Inventory workflow support","Expandable database structure"],
                technologies:["HTML","CSS","JavaScript","Database","Inventory Management"],
                learning:"This project focuses on applying programming, database concepts, information management, and user-interface design to a practical business workflow."
            },
            "syscore": {
                title:"SysCore",category:"GAME DEVELOPMENT",icon:"fa-server",
                description:"A 3D system administration simulation game designed to introduce system administration concepts through interactive gameplay.",
                overview:"SysCore explores how technical concepts can be presented through an interactive game environment.",
                features:["Interactive gameplay","System administration concepts","3D environment","Simulation-oriented design"],
                technologies:["Unity","C#","Blender"],
                learning:"The project supports learning in game design, Unity development, systems concepts, and 3D asset workflows."
            },
            "hand-ninja-ai": {
                title:"Hand Ninja AI",category:"PERSONAL PROJECT",icon:"fa-hand-sparkles",
                description:"A camera-based hand tracking arcade game that uses real-time hand gestures to interact with game objects.",
                overview:"Hand Ninja AI combines computer vision and interactive gameplay through webcam-based hand tracking.",
                features:["Real-time hand tracking","Gesture interaction","Arcade gameplay","Camera input"],
                technologies:["Python","OpenCV","MediaPipe","NumPy","Pygame"],
                learning:"The project helped explore computer vision, gesture recognition, real-time camera processing, and interactive game development."
            },
            "face-tracking": {
                title:"Face Tracking AI Scanner",category:"PERSONAL PROJECT",icon:"fa-user-check",
                description:"A face tracking experiment that detects faces and displays scanning and recognition-style visual states.",
                overview:"The project experiments with real-time face detection and futuristic scanner-style visual feedback.",
                features:["Face detection","Face tracking","Scanner interface","Real-time visual feedback"],
                technologies:["Python","OpenCV","MediaPipe","Computer Vision"],
                learning:"The project supports experimentation with face detection, camera processing, and real-time computer vision."
            },
            "qr-attendance": {
                title:"QR Code Attendance System",category:"DEVELOPMENT PROJECT",icon:"fa-qrcode",
                description:"A QR code-based attendance project designed to support scanning and recording attendance information.",
                overview:"The system focuses on using QR codes and camera input to make attendance recording more structured.",
                features:["QR scanning","Attendance processing","Record management","Camera-based interaction"],
                technologies:["Python","OpenCV","QR Code","Database"],
                learning:"The project helped explore QR processing, camera integration, attendance workflows, and data management."
            }
        };

        const key = new URLSearchParams(location.search).get("project") || "warehouse-inventory";
        const project = projects[key] || projects["warehouse-inventory"];
        document.title = `${project.title} | Vince Portfolio`;

        document.getElementById("detailsContainer").innerHTML = `
            <a class="back-link" href="index.html#projects"><i class="fas fa-arrow-left"></i> Back to Featured Projects</a>
            <section class="details-hero">
                <div class="details-icon"><i class="fas ${project.icon}"></i></div>
                <span class="details-category">${project.category}</span>
                <h1>${project.title}</h1>
                <p>${project.description}</p>
                <div class="details-tags">${project.technologies.map(t=>`<span>${t}</span>`).join("")}</div>
            </section>
            <div class="details-content">
                <article class="details-card"><h2><i class="fas fa-circle-info"></i> Project Overview</h2><p>${project.overview}</p></article>
                <article class="details-card"><h2><i class="fas fa-star"></i> Key Features</h2><ul>${project.features.map(f=>`<li>${f}</li>`).join("")}</ul></article>
                <article class="details-card"><h2><i class="fas fa-code"></i> Technologies Used</h2><p>${project.technologies.join(" • ")}</p></article>
                <article class="details-card"><h2><i class="fas fa-graduation-cap"></i> What I Learned</h2><p>${project.learning}</p></article>
            </div>
        `;
    </script>
</body>
</html>
